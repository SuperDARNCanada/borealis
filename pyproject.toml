[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borealis"
dynamic = ["version"]
description = "SuperDARN Digital Radar System"
readme = "README.md"
authors = [{name = "SuperDARN Canada"}]
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "backscatter @ git+https://github.com/SuperDARNCanada/backscatter.git",
    "darn-dmap>=0.1.6",
    "graypy",
    "h5py>=3.3.0",
    "inotify",
    "numpy<2",
    "posix_ipc",
    "pydantic>=2",
    "pyDARNio @ git+https://github.com/SuperDARN/pyDARNio.git@develop",
    "rich",
    "scipy",
    "structlog==24.1.0",
    "zmq",
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[project.optional-dependencies]
gpu = ["cupy"]
dev = [
    "ruff",
    "pre-commit",
    "jupyter",
]
doc = [
    "breathe",
    "docutils==0.21",
    "furo==2025.09.25",
    "latex",
    "myst_parser",
    "sphinx==8.2.2",
    "sphinx-book-theme==1.1.4",
    "sphinx-favicon",
    "sphinx-tabs",
    "sphinxcontrib-autoprogram",
    "sphinxcontrib-programoutput",
]

[project.urls]
Homepage = "https://borealis.readthedocs.io"

[project.scripts]
steamed_hams = "scripts.steamed_hams:main"
restart_borealis = "scripts.restart_borealis:main"

[tool.setuptools.packages.find]
where = ["borealis", "build"]
exclude = ["usrp_drivers", "src.borealis_experiments.tests*"]

[tool.ruff]
include = [
    "scheduler/**/*.py",
    "scripts/**/*.py",
    "src/**/*.py",
    "tests/**/*.ipynb",
    "tests/**/*.py",
    "**/pyproject.toml"
]
extend-exclude = [
    "tests/archive/**/*",
    "src/borealis_experiments/archive/*.py"
]

[tool.ruff.lint]
ignore = ["E402"]   # Module level import not at top of file (required for sys.path.append() before import)
